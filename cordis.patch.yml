# Host half of the plugin updater: checks GitHub-installed bundles against
# the package.json version on their repository's main branch, once at
# startup and on demand, and reinstalls them through the plugin manager.
- insert:
    - id: plugin-updater
      name: 'dsh-plugin-updater'
      # Optional: a GitHub token raises the API rate limit (60 requests/hour
      # unauthenticated). It is only sent to api.github.com.
      # config:
      #   githubToken: !!js process.env.GITHUB_TOKEN
